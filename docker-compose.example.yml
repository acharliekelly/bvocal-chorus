name: wp-bvocal

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bvocal_local
      MYSQL_USER: bvocal
      MYSQL_PASSWORD: change-this-local-password
      MYSQL_ROOT_PASSWORD: change-this-root-password
    volumes:
      - ./docker/db-data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8091:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bvocal_local
      WORDPRESS_DB_USER: bvocal
      WORDPRESS_DB_PASSWORD: change-this-local-password
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./wordpress:/var/www/html
      - ./themes/bvocal:/var/www/html/wp-content/themes/bvocal
      - ./plugins/bvocal-gig-rsvp:/var/www/html/wp-content/plugins/bvocal-gig-rsvp
      - ./plugins/bvocal-repertoire:/var/www/html/wp-content/plugins/bvocal-repertoire

  wpcli:
    image: wordpress:cli
    user: xfs
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bvocal_local
      WORDPRESS_DB_USER: bvocal
      WORDPRESS_DB_PASSWORD: change-this-local-password
    volumes:
      - ./wordpress:/var/www/html
      - ./themes/bvocal:/var/www/html/wp-content/themes/bvocal
      - ./plugins/bvocal-gig-rsvp:/var/www/html/wp-content/plugins/bvocal-gig-rsvp
      - ./plugins/bvocal-repertoire:/var/www/html/wp-content/plugins/bvocal-repertoire
